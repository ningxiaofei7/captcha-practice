<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>驗證碼輸入練習</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f5f5;color:#222}.top{height:72px;background:#fff;padding:28px 18px 0;font-size:15px;font-weight:700}.wrap{max-width:660px;margin:38px auto;background:#fff;border:1px solid #ddd;border-radius:30px;padding:70px 26px 30px;text-align:center}h1{font-size:46px;margin:0 0 42px;font-weight:800}.sub{font-size:25px;color:#777;line-height:1.45;margin-bottom:48px}.practice{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:center}input{width:100%;height:126px;border:3px solid #999;border-radius:18px;text-align:center;font-size:42px;font-weight:700;letter-spacing:7px;outline:none}input:focus{border-color:#d99a00}.captcha{height:126px;border:2px solid #bbb;border-radius:16px;background:#fafafa;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.captcha:before,.captcha:after{content:"";position:absolute;width:130%;height:4px;background:#ddd;left:-15%;top:50%}.captcha:before{transform:rotate(14deg)}.captcha:after{transform:rotate(-12deg)}.chars{position:relative;z-index:1;display:flex;align-items:center;justify-content:center}.ch{display:inline-block;font-size:48px;font-weight:700;line-height:1;margin:0 2px}button{margin-top:26px;width:215px;height:86px;border:0;border-radius:16px;background:#222;color:#fff;font-size:28px;font-weight:700}.msg{height:52px;margin-top:22px;font-size:25px;font-weight:700}.stats{border-top:1px solid #ddd;margin-top:28px;padding-top:34px;display:grid;grid-template-columns:1fr 1fr;row-gap:24px}.num{font-size:42px;font-weight:700}.lab{font-size:20px;color:#777;margin-top:6px}.restart{width:auto;height:auto;padding:15px 28px;margin-top:26px;background:#eee;color:#333;font-size:22px}.note{font-size:16px;color:#888;margin-top:28px;line-height:1.5}@media(max-width:700px){
body{background:#f5f5f5}
.top{height:54px;padding:20px 16px 0;font-size:14px}
.wrap{margin:20px 12px;padding:36px 18px 24px;border-radius:22px}
h1{font-size:30px;margin-bottom:24px}
.sub{font-size:17px;line-height:1.5;margin-bottom:28px}
.practice{grid-template-columns:1.55fr 1fr;gap:10px}
input{height:68px;border-width:2px;border-radius:12px;font-size:28px;letter-spacing:5px}
.captcha{height:68px;border-radius:12px}
.captcha:before,.captcha:after{height:3px}
.ch{font-size:30px;margin:0 1px}
button{margin-top:20px;width:170px;height:58px;border-radius:12px;font-size:22px}
.msg{height:38px;margin-top:14px;font-size:19px}
.stats{margin-top:20px;padding-top:24px;row-gap:18px}
.num{font-size:30px}
.lab{font-size:16px}
.restart{padding:11px 20px;margin-top:20px;font-size:17px}
.note{font-size:13px;margin-top:20px}
}
</style></head><body><div class="top">驗證碼輸入練習</div><main class="wrap"><h1>驗證碼輸入練習</h1><div class="sub">英文 + 數字隨機 4 碼｜保證兩種都有｜輸入<br>不分大小寫</div><div class="practice"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="4"><div class="captcha"><div id="captcha" class="chars"></div></div></div><button id="confirm">確認</button><div id="msg" class="msg"></div><div class="stats"><div><div id="correct" class="num">0</div><div class="lab">答對</div></div><div><div id="wrong" class="num">0</div><div class="lab">答錯</div></div><div><div id="rate" class="num">—</div><div class="lab">正確率</div></div><div><div id="speed" class="num">—</div><div class="lab">平均速度</div></div></div><button id="restart" class="restart">重新開始</button><div class="note">0/O、I/l/1 等易混淆字元刻意保留；字元會隨機旋轉、上下偏移與變換字型。</div></main><script>
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz",digits="0123456789",all=letters+digits;let expected="",correct=0,wrong=0,times=[],startedAt=0;
const pick=s=>s[Math.floor(Math.random()*s.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newCaptcha(){expected=shuffle([pick(letters),pick(digits),pick(all),pick(all)]).join("");let b=document.getElementById("captcha");b.innerHTML="";let f=["Arial","Verdana","Tahoma","Georgia","Courier New"];[...expected].forEach(c=>{let x=document.createElement("span");x.className="ch";x.textContent=c;x.style.transform=`translateY(${(Math.random()*14-7).toFixed(1)}px) rotate(${(Math.random()*24-12).toFixed(1)}deg)`;x.style.fontFamily=f[Math.floor(Math.random()*f.length)];b.appendChild(x)});let i=document.getElementById("answer");i.value="";document.getElementById("msg").textContent="";startedAt=performance.now();setTimeout(()=>i.focus(),30)}
function stats(){let n=correct+wrong;document.getElementById("correct").textContent=correct;document.getElementById("wrong").textContent=wrong;document.getElementById("rate").textContent=n?Math.round(correct/n*100)+"%":"—";document.getElementById("speed").textContent=times.length?(times.reduce((a,b)=>a+b,0)/times.length).toFixed(2)+" 秒":"—"}
function check(){let i=document.getElementById("answer"),typed=i.value.trim();let ok=typed.length===4&&typed.toLowerCase()===expected.toLowerCase();times.push((performance.now()-startedAt)/1000);if(ok){correct++;document.getElementById("msg").textContent="✓ 正確";stats();setTimeout(newCaptcha,350)}else{wrong++;document.getElementById("msg").textContent="× 錯誤，再輸入一次";stats();i.select()}}
document.getElementById("confirm").onclick=check;document.getElementById("answer").onkeydown=e=>{if(e.key==="Enter")check()};document.getElementById("restart").onclick=()=>{correct=0;wrong=0;times=[];stats();newCaptcha()};stats();newCaptcha();
</script></body></html>
