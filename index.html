<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>驗證碼輸入練習</title>
<style>*{box-sizing:border-box}body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f5f5;margin:0;padding:40px 18px;color:#222}.card{max-width:760px;margin:auto;background:white;padding:32px;border:1px solid #ddd;border-radius:18px}h1,.sub{text-align:center}.sub{color:#666;margin-bottom:28px}.captcha{position:relative;max-width:440px;height:150px;margin:0 auto 24px;border:1px solid #bbb;border-radius:12px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;overflow:hidden}.captcha:before,.captcha:after{content:"";position:absolute;width:120%;height:3px;left:-10%;top:50%;background:#d7d7d7;transform:rotate(14deg)}.captcha:after{transform:rotate(-11deg);background:#e3e3e3}#code{z-index:1;display:flex;gap:8px;align-items:center;user-select:none}.ch{display:inline-block;font-size:64px;line-height:1;color:#151515;text-shadow:.5px .5px #777}form{max-width:440px;margin:auto;display:flex;gap:10px}input{flex:1;min-width:0;padding:12px;border:2px solid #999;border-radius:10px;font-size:28px;font-weight:bold;text-align:center;letter-spacing:8px}button{border:0;border-radius:10px;padding:0 22px;background:#222;color:white;font-size:17px;font-weight:bold;cursor:pointer}#msg{text-align:center;height:28px;margin:14px 0;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #ddd;padding-top:20px}.stat{text-align:center}.num{font-size:24px;font-weight:bold}.lab,.tip{font-size:12px;color:#777}.tip{text-align:center;margin-top:20px}.reset{text-align:center;margin-top:20px}.reset button{background:#eee;color:#333;padding:10px 16px}@media(max-width:520px){body{padding:20px 10px}.card{padding:22px 14px}.ch{font-size:50px}form{flex-direction:column}button{min-height:48px}.stats{grid-template-columns:repeat(2,1fr);gap:15px}}</style></head>
<body><div class="card"><h1>驗證碼輸入練習</h1><div class="sub">英文＋數字隨機 4 碼｜保證兩種都有｜輸入不分大小寫</div><div class="captcha"><div id="code"></div></div>
<form id="form"><input id="answer" maxlength="4" autocomplete="off" spellcheck="false" autofocus placeholder="4 碼"><button type="button" id="confirm">確認</button></form><div id="msg"></div>
<div class="stats"><div class="stat"><div class="num" id="right">0</div><div class="lab">答對</div></div><div class="stat"><div class="num" id="wrong">0</div><div class="lab">答錯</div></div><div class="stat"><div class="num" id="acc">—</div><div class="lab">正確率</div></div><div class="stat"><div class="num" id="avg">—</div><div class="lab">平均速度</div></div></div>
<div class="reset"><button type="button" id="reset">重新開始</button></div><div class="tip">O/0、I/l/1 等易混淆字元刻意保留；字元會隨機旋轉、上下偏移與變換字型。</div></div>
<script>
const L='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',D='0123456789',A=L+D,F=['Arial','Georgia','Verdana','Trebuchet MS','Times New Roman'];let cur='',right=0,wrong=0,total=0,start=0;const $=x=>document.getElementById(x),input=$('answer'),msg=$('msg');const pick=s=>s[Math.floor(Math.random()*s.length)];
function make(){let a=[pick(L),pick(D),pick(A),pick(A)];for(let i=3;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.join('')}
function render(){let b=$('code');b.textContent='';[...cur].forEach(c=>{let s=document.createElement('span');s.className='ch';s.textContent=c;s.style.fontFamily=pick(F);s.style.fontWeight=Math.random()<.5?'600':'800';s.style.transform=`translateY(${(Math.random()*16-8).toFixed(1)}px) rotate(${(Math.random()*14-7).toFixed(1)}deg) scale(${(.94+Math.random()*.12).toFixed(2)})`;b.appendChild(s)})}
function next(){cur=make();render();input.value='';msg.textContent='';start=performance.now();input.focus()}
function stats(){$('right').textContent=right;$('wrong').textContent=wrong;let n=right+wrong;$('acc').textContent=n?Math.round(right/n*100)+'%':'—';$('avg').textContent=right?(total/right/1000).toFixed(2)+' 秒':'—'}
function check(){if(input.value.length<4){msg.textContent='請輸入完整 4 碼';input.focus();return}if(input.value.toLowerCase()===cur.toLowerCase()){right++;total+=performance.now()-start;msg.textContent='✓ 正確';stats();setTimeout(next,180)}else{wrong++;msg.textContent='✕ 錯誤，再輸入一次';stats();input.select()}}
input.addEventListener('input',()=>input.value=input.value.replace(/[^A-Za-z0-9]/g,'').slice(0,4));input.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});$('form').addEventListener('submit',e=>e.preventDefault());$('confirm').addEventListener('click',check);$('reset').addEventListener('click',()=>{right=wrong=total=0;stats();next()});stats();next();
</script></body></html>
